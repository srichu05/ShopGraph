services:
  neo4j:
    image: neo4j:5.26-community
    container_name: shopgraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
